<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Especies Forestales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .speaking-card {
      border-color: #10B981 !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 text-center shadow-lg">
    <h1 class="text-xl font-bold text-emerald-400 flex items-center justify-center gap-2">
      <i class="fa-solid font-leaf text-emerald-500"></i> BotánicIA Reader
    </h1>
    <p class="text-xs text-slate-400 mt-1">Lector de exámenes y fichas taxonómicas</p>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col gap-6">

    <!-- Indicador de Conexión al Servidor (Backend) -->
    <div id="serverStatusCard" class="p-3.5 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-between text-sm transition-all duration-300">
      <div class="flex items-center gap-3">
        <div class="relative flex h-3.5 w-3.5 items-center justify-center">
          <span id="serverPingPulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
          <span id="serverPingDot" class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
        </div>
        <div>
          <p id="serverStatusTitle" class="font-medium text-amber-300">Comprobando servidor...</p>
          <p id="serverStatusSub" class="text-xs text-slate-400">Reintentando conexión automáticamente...</p>
        </div>
      </div>
      <button id="btnRetryConnect" onclick="checkServerConnection(true)" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 py-1.5 px-3 rounded-lg transition border border-slate-600 flex items-center gap-1.5">
        <i class="fa-solid fa-arrows-rotate text-xs"></i> Verificar
      </button>
    </div>

    <!-- Indicador de Audífonos -->
    <div id="headphoneStatus" class="p-3 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-between text-sm">
      <div class="flex items-center gap-3">
        <i id="headphoneIcon" class="fa-solid fa-headphones text-slate-500 text-lg"></i>
        <div>
          <p id="headphoneText" class="font-medium text-slate-300">Comprobando audífonos...</p>
          <p class="text-xs text-slate-400">Requerido para síntesis por voz</p>
        </div>
      </div>
      <button onclick="checkHeadphones()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 py-1 px-3 rounded-lg transition">
        Verificar
      </button>
    </div>

    <!-- Opciones de Selección de Imagen -->
    <div class="grid grid-cols-2 gap-4">
      <!-- Input Cámara -->
      <label class="flex flex-col items-center justify-center p-6 bg-emerald-950/40 border-2 border-dashed border-emerald-600/50 hover:border-emerald-500 rounded-2xl cursor-pointer transition active:scale-95 text-center">
        <i class="fa-solid fa-camera text-3xl text-emerald-400 mb-2"></i>
        <span class="font-semibold text-emerald-200 text-sm">Tomar Foto</span>
        <span class="text-xs text-emerald-500 mt-1">Cámara directa</span>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
      </label>

      <!-- Input Archivos / Galería -->
      <label class="flex flex-col items-center justify-center p-6 bg-slate-800/80 border-2 border-dashed border-slate-600 hover:border-slate-500 rounded-2xl cursor-pointer transition active:scale-95 text-center">
        <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
        <span class="font-semibold text-slate-200 text-sm">Abrir Galería</span>
        <span class="text-xs text-slate-400 mt-1">Archivos e imágenes</span>
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
      </label>
    </div>

    <!-- Previsualización / Estado del Servidor -->
    <div id="statusContainer" class="hidden flex flex-col items-center justify-center p-6 bg-slate-800/50 rounded-2xl border border-slate-700 text-center">
      <div id="spinner" class="animate-spin text-emerald-400 text-3xl mb-3">
        <i class="fa-solid fa-circle-notch"></i>
      </div>
      <p id="statusMessage" class="font-medium text-slate-200">Enviando imagen al servidor...</p>
      <p id="retryCount" class="text-xs text-emerald-400 mt-1"></p>
    </div>

    <!-- Controles de Audio -->
    <div id="audioControls" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="btnPlayPause" onclick="toggleAudio()" class="w-12 h-12 bg-emerald-500 hover:bg-emerald-400 text-slate-900 rounded-full flex items-center justify-center text-xl transition shadow-lg">
          <i class="fa-solid fa-pause"></i>
        </button>
        <div>
          <p class="font-semibold text-sm text-slate-100" id="audioStateLabel">Reproduciendo en bucle</p>
          <p class="text-xs text-slate-400">Repetición activa (2x por especie)</p>
        </div>
      </div>
      <button onclick="stopAudio()" class="text-xs bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 py-2 px-3 rounded-lg border border-rose-500/30 transition">
        Detener
      </button>
    </div>

    <!-- Vista de Resultados -->
    <div id="resultsList" class="flex flex-col gap-4 mb-8"></div>

  </main>

  <script>
    // URLs del Backend
    const BACKEND_BASE_URL = "https://especies-ia-backend.onrender.com";
    const HEALTH_URL = `${BACKEND_BASE_URL}/`;
    const ANALYZE_URL = `${BACKEND_BASE_URL}/analizar-examen/`;

    // Estados
    let isServerConnected = false;
    let isCheckingServer = false;
    let pendingFile = null;
    let isUploading = false;
    let currentResults = [];
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let wakeLock = null;
    let hasHeadphones = false;

    // --- 0. Detección de Estado del Servidor y Reconexión Automática ---
    async function checkServerConnection(isManual = false) {
      if (isCheckingServer && !isManual) return;
      isCheckingServer = true;

      const card = document.getElementById('serverStatusCard');
      const pulse = document.getElementById('serverPingPulse');
      const dot = document.getElementById('serverPingDot');
      const title = document.getElementById('serverStatusTitle');
      const sub = document.getElementById('serverStatusSub');
      const btn = document.getElementById('btnRetryConnect');

      if (isManual) {
        btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-xs"></i> Conectando...';
        btn.disabled = true;
      }

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        const response = await fetch(HEALTH_URL, {
          method: 'GET',
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (response.ok) {
          isServerConnected = true;
          pulse.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
          dot.className = "relative inline-flex rounded-full h-3 w-3 bg-emerald-500";
          title.className = "font-medium text-emerald-400";
          title.textContent = "Servidor Conectado";
          
          if (pendingFile) {
            sub.textContent = "¡Conexión lista! Enviando foto almacenada...";
            sub.className = "text-xs text-emerald-300 font-semibold animate-pulse";
          } else {
            sub.textContent = "Listo para recibir y analizar imágenes";
            sub.className = "text-xs text-slate-400";
          }

          card.className = "p-3.5 rounded-xl bg-emerald-950/30 border border-emerald-700/60 flex items-center justify-between text-sm transition-all duration-300";

          // AL TOQUE: Si hay una foto esperando, la envía de inmediato
          if (pendingFile && !isUploading) {
            processPendingUpload();
          }
        } else {
          throw new Error(`Status Code: ${response.status}`);
        }
      } catch (err) {
        isServerConnected = false;
        pulse.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75";
        dot.className = "relative inline-flex rounded-full h-3 w-3 bg-rose-500";
        title.className = "font-medium text-rose-400";
        title.textContent = "Sin conexión con el servidor";

        if (pendingFile) {
          sub.textContent = "Foto guardada. Reintentando conectar al servidor para enviar...";
          sub.className = "text-xs text-amber-300 font-semibold animate-pulse";
        } else {
          sub.textContent = "Insistiendo en conectar en segundo plano...";
          sub.className = "text-xs text-slate-400";
        }

        card.className = "p-3.5 rounded-xl bg-rose-950/30 border border-rose-800/60 flex items-center justify-between text-sm transition-all duration-300";
      } finally {
        isCheckingServer = false;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrows-rotate text-xs"></i> Verificar';
      }
    }

    // Bucle de reintento/verificación constante (cada 3.5 segundos)
    setInterval(() => {
      if (!isUploading) {
        checkServerConnection();
      }
    }, 3500);

    // Iniciar verificación al cargar la web
    checkServerConnection();

    // 1. Detección de Audífonos
    async function checkHeadphones() {
      const icon = document.getElementById('headphoneIcon');
      const text = document.getElementById('headphoneText');
      
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          text.textContent = "No se puede detectar audífonos automáticamente.";
          hasHeadphones = true; // Fallback
          return;
        }

        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioOutputs = devices.filter(d => d.kind === 'audiooutput');

        hasHeadphones = audioOutputs.some(device => 
          device.label.toLowerCase().includes('headphone') || 
          device.label.toLowerCase().includes('auricular') ||
          device.label.toLowerCase().includes('headset') ||
          device.label.toLowerCase().includes('handsfree')
        );

        if (hasHeadphones) {
          icon.className = "fa-solid fa-headphones text-emerald-400 text-lg";
          text.textContent = "Audífonos detectados y listos";
          text.className = "font-medium text-emerald-400";
        } else {
          icon.className = "fa-solid fa-volume-xmark text-amber-400 text-lg";
          text.textContent = "Conecte audífonos para mejor experiencia";
          text.className = "font-medium text-amber-400";
        }
      } catch (e) {
        hasHeadphones = true; // Asumir verdadero para evitar bloquear funcionalidad
        text.textContent = "Audífonos habilitados";
      }
    }

    // Listener para cuando se conectan/desconectan audífonos en tiempo real
    if (navigator.mediaDevices) {
      navigator.mediaDevices.ondevicechange = checkHeadphones;
    }
    checkHeadphones();

    // 2. Mantener la Pantalla y CPU despiertos (Screen Wake Lock)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn(`Wake Lock Error: ${err.name}, ${err.message}`);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    // 3. Manejo de Selección de Imagen y Subida Controlada por Estado
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Guardar el archivo seleccionado como pendiente
      pendingFile = file;

      // Resetear inputs para permitir volver a seleccionar si se desea
      document.getElementById('cameraInput').value = '';
      document.getElementById('fileInput').value = '';

      const statusContainer = document.getElementById('statusContainer');
      const statusMessage = document.getElementById('statusMessage');
      const retryCount = document.getElementById('retryCount');
      const resultsList = document.getElementById('resultsList');

      resultsList.innerHTML = '';
      stopAudio();

      if (!isServerConnected) {
        statusContainer.classList.remove('hidden');
        statusMessage.textContent = "Foto guardada. Servidor sin conexión actualmente.";
        retryCount.textContent = "Insistiendo en conectar... Se enviará automáticamente apenas se restablezca la conexión.";
        
        // Forzar chequeo inmediato de conexión
        checkServerConnection(true);
      } else {
        processPendingUpload();
      }
    }

    // Procesa el envío de la foto si está conectado
    async function processPendingUpload() {
      if (!pendingFile || isUploading || !isServerConnected) return;

      isUploading = true;
      const fileToSend = pendingFile;

      const statusContainer = document.getElementById('statusContainer');
      const statusMessage = document.getElementById('statusMessage');
      const retryCount = document.getElementById('retryCount');
      const resultsList = document.getElementById('resultsList');

      statusContainer.classList.remove('hidden');
      statusMessage.textContent = "Analizando imagen con IA...";
      retryCount.textContent = "Enviando datos al servidor...";

      try {
        const formData = new FormData();
        formData.append('file', fileToSend);

        const response = await fetch(ANALYZE_URL, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          let errorDetail = `HTTP ${response.status}`;
          try {
            const errJson = await response.json();
            if (errJson.detail) errorDetail = errJson.detail;
          } catch(e) {
            const errTxt = await response.text().catch(() => '');
            if (errTxt) errorDetail = errTxt;
          }
          throw new Error(errorDetail);
        }

        const data = await response.json();
        currentResults = data.resultados || [];

        // Éxito: Limpiar foto pendiente
        pendingFile = null;
        statusContainer.classList.add('hidden');
        renderResults(currentResults);
        if (currentResults.length > 0) {
          startLoopingAudio();
        }

      } catch (error) {
        console.warn("Fallo en la subida de imagen:", error);

        // Si es un error de respuesta HTTP del servidor (ej 500, 400), el servidor SÍ está conectado pero falló el procesamiento
        if (error.message && (error.message.includes("HTTP") || error.message.includes("Error procesando") || error.message.includes("500") || error.message.includes("400"))) {
          statusMessage.textContent = "Error al procesar la foto con la IA";
          retryCount.textContent = error.message;
          pendingFile = null; // Se despeja la foto para permitir subir otra
        } else {
          // Si fue fallo de red/conexión
          isServerConnected = false;
          statusMessage.textContent = "Se perdió la conexión durante el envío.";
          retryCount.textContent = "Reintentando conectar con el servidor...";
          checkServerConnection(true);
        }
      } finally {
        isUploading = false;
      }
    }

    // 4. Renderizar resultados en pantalla
    function renderResults(results) {
      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = '';

      results.forEach((item, index) => {
        const card = document.createElement('div');
        card.id = `card-especie-${index}`;
        card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 transition-all duration-300";

        const campo = (item.campo_a_completar || '').toLowerCase();
        const campoLabel = campo === 'nombre_comun' ? 'Nombre común'
                         : campo === 'especie'      ? 'Nombre científico'
                         : campo === 'familia'      ? 'Familia'
                         : null;

        const badgeCampo = campoLabel
          ? `<span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-full px-2 py-0.5 ml-2">✏️ Completar: ${campoLabel}</span>`
          : '';

        const deletreoHTML = (campo && campo !== 'ninguno' && item.campo_a_completar_deletreado)
          ? `<div class="mt-2 p-2 bg-slate-700/50 rounded-lg border border-amber-500/30">
               <p class="text-xs text-amber-300 font-semibold mb-1">Deletreo de ${campoLabel}:</p>
               <p class="text-xs text-slate-300 font-mono leading-relaxed">${item.campo_a_completar_deletreado}</p>
             </div>`
          : '';

        card.innerHTML = `
          <div class="flex items-center justify-between mb-2 border-b border-slate-700/60 pb-2">
            <div class="flex items-center flex-wrap gap-1">
              <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Especie #${index + 1}</span>
              ${badgeCampo}
            </div>
            <button onclick="speakSingle(${index})" class="text-xs text-slate-400 hover:text-emerald-400">
              <i class="fa-solid fa-volume-high"></i> Escuchar solo esta
            </button>
          </div>
          <p class="text-sm text-slate-300 mb-1">
            <strong class="text-slate-100">Nombre común:</strong> ${item.nombre_comun}
          </p>
          <p class="text-sm text-slate-300 mb-1">
            <strong class="text-slate-100">Especie:</strong> <em class="text-emerald-300">${item.especie}</em>
          </p>
          <p class="text-sm text-slate-300 mb-1">
            <strong class="text-slate-100">Familia:</strong> ${item.familia}
          </p>
          ${deletreoHTML}
        `;
        resultsList.appendChild(card);
      });
    }


    // Formatea un texto deletreado del backend para el TTS.
    // El backend ya manda "S, w, i, e, t, e, n, i, a, espacio, m, ..." — solo limpiamos
    // posibles guiones residuales y devolvemos el texto tal cual para que el TTS lo lea.
    function formatSpelling(str) {
      if (!str) return '';
      // Si el backend mandó formato antiguo con guiones (ej: "S-w-i-e-t-e-n-i-a"), convertir
      // guiones a ", " para que suene a deletreo
      if (str.includes('-') && !str.includes(',')) {
        return str.replace(/-/g, ', ');
      }
      // Ya viene en formato correcto: "S, w, i, e, t, e, n, i, a, espacio, ..."
      return str;
    }

    // 5. Motor de Audio / Síntesis por Voz en Bucle
    function startLoopingAudio() {
      if (!hasHeadphones) {
        // Mostrar advertencia y no reproducir hasta que conecten audífonos
        const icon = document.getElementById('headphoneIcon');
        const text = document.getElementById('headphoneText');
        icon.className = "fa-solid fa-triangle-exclamation text-rose-400 text-lg";
        text.textContent = "¡Conecte audífonos para escuchar el resultado!";
        text.className = "font-medium text-rose-400";
        // Monitorear cambio de dispositivos para reproducir automáticamente al conectar
        if (navigator.mediaDevices) {
          navigator.mediaDevices.ondevicechange = async () => {
            await checkHeadphones();
            if (hasHeadphones && currentResults.length > 0) {
              startLoopingAudio();
            }
          };
        }
        return;
      }
      stopAudio();
      requestWakeLock();
      isSpeaking = true;
      document.getElementById('audioControls').classList.remove('hidden');
      playCycle();
    }

    async function playCycle() {
      if (!isSpeaking) return;

      for (let index = 0; index < currentResults.length; index++) {
        if (!isSpeaking) break;

        const item = currentResults[index];
        highlightCard(index);

        // Repetir 2 VECES por especie
        for (let rep = 1; rep <= 2; rep++) {
          if (!isSpeaking) break;

          // 1. Lectura normal de todos los campos (velocidad normal 0.9)
          const textoNormal = `Especie ${index + 1}. Nombre común: ${item.nombre_comun}. Nombre científico: ${item.especie}. Familia: ${item.familia}.`;
          await speakUtterance(textoNormal, 0.9);

          if (!isSpeaking) break;

          // 2. Deletreo LENTO solo del campo que faltaba completar (velocidad 0.35)
          const campo = (item.campo_a_completar || '').toLowerCase();
          if (campo && campo !== 'ninguno' && item.campo_a_completar_deletreado) {
            const nombreCampo = campo === 'nombre_comun' ? 'Nombre común'
                              : campo === 'especie'      ? 'Nombre científico'
                              : 'Familia';
            const textoDeletreo = `Deletreo de ${nombreCampo}: ${formatSpelling(item.campo_a_completar_deletreado)}.`;
            await speakUtterance(textoDeletreo, 0.35);
          }

          if (isSpeaking) await new Promise(r => setTimeout(r, 1200)); // Pausa breve entre repeticiones
        }

        unhighlightCard(index);
      }

      // Reiniciar bucle infinito
      if (isSpeaking) {
        setTimeout(() => playCycle(), 2000);
      }
    }

    function speakUtterance(text, speed = 0.85) {
      return new Promise((resolve) => {
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = speed; // Velocidad dinámica: 0.9 lectura normal, 0.35 deletreo súper lento

        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();

        currentUtterance = utterance;
        synth.speak(utterance);
      });
    }

    function highlightCard(index) {
      const card = document.getElementById(`card-especie-${index}`);
      if (card) {
        card.classList.add('speaking-card');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function unhighlightCard(index) {
      const card = document.getElementById(`card-especie-${index}`);
      if (card) {
        card.classList.remove('speaking-card');
      }
    }

    function toggleAudio() {
      const synth = window.speechSynthesis;
      const btn = document.getElementById('btnPlayPause');
      const label = document.getElementById('audioStateLabel');

      if (synth.speaking && !synth.paused) {
        synth.pause();
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
        label.textContent = "Pausado";
      } else if (synth.paused) {
        synth.resume();
        btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        label.textContent = "Reproduciendo en bucle";
      } else {
        startLoopingAudio();
      }
    }

    function stopAudio() {
      isSpeaking = false;
      const synth = window.speechSynthesis;
      synth.cancel();
      releaseWakeLock();
      
      document.querySelectorAll('.speaking-card').forEach(el => el.classList.remove('speaking-card'));
      document.getElementById('audioControls').classList.add('hidden');
    }

    async function speakSingle(index) {
      if (!hasHeadphones) {
        const text = document.getElementById('headphoneText');
        text.textContent = "¡Conecte audífonos para escuchar!";
        text.className = "font-medium text-rose-400";
        return;
      }
      stopAudio();
      const item = currentResults[index];
      if (!item) return;

      isSpeaking = true;
      highlightCard(index);

      const textoNormal = `Nombre común: ${item.nombre_comun}. Nombre científico: ${item.especie}. Familia: ${item.familia}.`;
      await speakUtterance(textoNormal, 0.9);

      const campo = (item.campo_a_completar || '').toLowerCase();
      if (campo && campo !== 'ninguno' && item.campo_a_completar_deletreado) {
        const nombreCampo = campo === 'nombre_comun' ? 'Nombre común'
                          : campo === 'especie'      ? 'Nombre científico'
                          : 'Familia';
        const textoDeletreo = `Deletreo de ${nombreCampo}: ${formatSpelling(item.campo_a_completar_deletreado)}.`;
        await speakUtterance(textoDeletreo, 0.35);
      }

      isSpeaking = false;
      unhighlightCard(index);
    }
  </script>
</body>
</html>
